name: android-apk
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Add the Uzbek voice to the app
        run: |
          mkdir -p android/app/src/main/assets/uz
          cp models/uz/onnx/model_fp16.onnx android/app/src/main/assets/uz/model.onnx
          cp models/uz/vocab.json android/app/src/main/assets/uz/vocab.json
      - name: Build APK
        run: |
          set -o pipefail
          cd android && gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
          cp app/build/outputs/apk/release/app-release.apk ../Tarjimon.apk
          ls -la ../Tarjimon.apk
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tarjimon 1.0.${{ github.run_number }}
          body: "Tarjimon voice translator for Android. Download Tarjimon.apk below and open it on your phone to install."
          make_latest: true
          files: Tarjimon.apk
      - name: Save build report
        if: always()
        run: |
          mkdir -p /tmp/r && grep -E "^e: |error:|FAILURE|What went wrong|BUILD|Exception|> " build.log | head -120 > /tmp/r/report.txt || true
          echo "status=${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" >> /tmp/r/report.txt
          git config user.name "build-bot"; git config user.email "actions@users.noreply.github.com"
          git fetch origin ci-logs 2>/dev/null && git checkout -B ci-logs origin/ci-logs 2>/dev/null || git checkout --orphan ci-logs
          git rm -rf --cached . -q || true
          cp /tmp/r/report.txt android-build.txt
          git add android-build.txt && git commit -qm "android build report ${{ github.run_number }}" && git push -f origin ci-logs
