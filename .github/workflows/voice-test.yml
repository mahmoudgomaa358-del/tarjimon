name: voice-test
on:
  push:
    paths: ["tests/**", ".github/workflows/voice-test.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Run voice files with the app's engine version
        run: |
          mkdir -p tests/results && rm -f tests/results/native-*.wav
          pip install -q "numpy<2" onnxruntime==1.19.2
          python tests/native_voice_test.py > tests/results/native.txt 2>&1 || true
      - name: Save results
        run: |
          git config user.name "voice-test-bot"; git config user.email "actions@users.noreply.github.com"
          git add tests/results; git commit -m "voice test results [skip ci]" || true; git pull --rebase -q; git push
